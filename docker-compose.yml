# Phase 1 needs only Postgres. TimescaleDB image is used for Phase 2 continuity
# (hypertables are NOT enabled yet — see db/schema.sql).
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: vg
      POSTGRES_PASSWORD: vg
      POSTGRES_DB: vektorgauss
    ports:
      - "127.0.0.1:5432:5432"   # bind to localhost only
    volumes:
      - vg_pgdata:/var/lib/postgresql/data
      # Applied automatically on first init. `vg init-db` re-applies it idempotently.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vg -d vektorgauss"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vg_pgdata:
