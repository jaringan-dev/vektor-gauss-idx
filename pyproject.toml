[project]
name = "vektor-gauss"
version = "0.1.0"
description = "Personal bandarmology / capital-flow research tool for IDX (Phase 1: IDX Stock Summary + KSEI, official sources only)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # Impersonates Chrome's TLS/JA3 fingerprint. Required in practice: IDX's
    # Cloudflare challenges a plain httpx request and never clears it, even from a
    # residential IP. See src/vg/sources/idx.py.
    "curl-cffi>=0.7",
    # Phase B: parse the archived KSEI ownership-disclosure PDF forms.
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
cffi = ["curl-cffi>=0.7"]  # kept for back-compat; now already a core dep
dev = [
    "pytest>=8",
    "ruff>=0.9",
]
# Local superadmin dashboard (RENCANA-UI-UX §3). Optional: only needed for `vg serve`.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
vg = "vg.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit list: newer ruff releases widen the default set, which would turn the CI
# gate red on an upgrade with no code change.
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "PIE", "BLE", "S110"]
# range(0, n) is kept deliberately in engine.py next to range(1, n) (k = days back).
ignore = ["PIE808"]

[tool.ruff.lint.per-file-ignores]
# Fetch/persist boundaries: one bad day/ticker/PDF must not abort a batch; the
# exception is recorded as status='error' in run_log instead.
"src/vg/collect.py" = ["BLE001", "S110"]
"src/vg/sources/*.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
