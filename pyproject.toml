[project]
name = "vektor-gauss"
version = "0.1.0"
description = "Personal bandarmology / capital-flow research tool for IDX (Phase 1: IDX Stock Summary + KSEI, official sources only)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # Impersonates Chrome's TLS/JA3 fingerprint. Required in practice: IDX's
    # Cloudflare challenges a plain httpx request and never clears it, even from a
    # residential IP. See src/vg/sources/idx.py.
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
cffi = ["curl-cffi>=0.7"]  # kept for back-compat; now already a core dep
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
vg = "vg.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep Ruff's default rule set; only carve out rules that clash with a
# deliberate, project-wide choice. Everything else stays enforced.
ignore = [
    # Collectors are unattended: every fetch/parse/persist path catches broadly,
    # logs to run_log, and returns an "error" outcome so one bad ticker or day
    # never aborts the nightly batch. Narrowing these would defeat the point.
    "BLE001",   # blind-except
    # This tool runs on one box in one timezone (WIB). "today" and CLI date
    # args are intentionally naive local dates, not tz-aware instants.
    "DTZ007",   # naive datetime.strptime
    "DTZ011",   # naive date.today
]

[tool.pytest.ini_options]
testpaths = ["tests"]
